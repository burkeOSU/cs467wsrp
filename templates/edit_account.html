{% extends "base.html" %}
{% block content %}
    <h1>Edit Account</h1>
    <form class="form" action="{{ url_for('edit_account', id=acct.id) }}" method="post">
        <div class="formDiv">
            <!-- admin onfocus=document.querySelector("h1").innerText="Hacked!" autofocus  -->
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value={{ acct.name }} required />
        </div>
        <div class="formDiv">
            <label for="number">Number</label>
            <input type="text" id="number" name="number" value={{ acct.number }} required />
        </div>
        <div class="formDiv">
            <label for="balance">Balance</label>
            <input type="number" step="0.01" min="0.00" id="balance" name="balance" value={{ acct.balance }} required />
        </div>
        <div class="btnContainer">
            <button type="submit" class="btn">Save</button>
        </div>
    </form>
    {% if success %}
        <div class="successMsg">{{ success }}</div>
    {% endif %}
    {% if error %}
        <div class="errorMsg">{{ error }}</div>
    {% endif %}
{% endblock content %}
