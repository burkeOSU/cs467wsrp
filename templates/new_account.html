{% extends "base.html" %}
{% block content %}
    <h1>New Account</h1>
    <form class="form" action="{{ url_for("new_account") }}" method="post">
        <div class="toggleBtnContainer">
            <button class="toggleBtn selected" type="button" data-value="vulnerable" disabled>
                Vulnerable
            </button>
            <button class="toggleBtn" type="button" data-value="hardened">
                Hardened
            </button>
        </div>
        <input type="hidden" id="securityChoice" name="security_choice" value="vulnerable">
        <div class="formDiv">
            <label for="name">Name</label>
            <input type="text id="name" name="name" required />
        </div>
        <div class="formDiv">
            <label for="number">Number</label>
            <input type="text" id="number" name="number" required />
        </div>
        <div class="formDiv">
            <label for="balance">Balance</label>
            <input type="number" step="0.01" min="0.00" id="balance" name="balance" required />
        </div>
        <div class="btnContainer">
            <button type="submit" class="btn">Add Account</button>
        </div>
    </form>
    {% if error %}
        <div class="errorMsg">{{ error }}</div>
    {% endif %}
{% endblock content %}
